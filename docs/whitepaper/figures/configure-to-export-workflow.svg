<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Configure to export workflow</title><desc id="desc">Six-stage VeilForge workflow from configuration through scan, review, verify, optional publish and export.</desc><rect width="1200" height="430" rx="28" fill="#09111c"/><text x="60" y="68" fill="#75f7c8" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">EVIDENCE WORKFLOW</text><path d="M130 220H1070" stroke="#2a4f4a" stroke-width="4"/><g font-family="Arial" text-anchor="middle"><g fill="#102236" stroke="#75f7c8" stroke-width="2"><circle cx="130" cy="220" r="52"/><circle cx="318" cy="220" r="52"/><circle cx="506" cy="220" r="52"/><circle cx="694" cy="220" r="52"/><circle cx="882" cy="220" r="52"/><circle cx="1070" cy="220" r="52"/></g><g fill="#e0e8f2" font-size="16" font-weight="700"><text x="130" y="226">Configure</text><text x="318" y="226">Scan</text><text x="506" y="226">Review</text><text x="694" y="226">Verify</text><text x="882" y="226">Publish</text><text x="1070" y="226">Export</text></g><g fill="#7f8fa4" font-size="13"><text x="130" y="307">scope + policy</text><text x="318" y="307">local compiler</text><text x="506" y="307">source evidence</text><text x="694" y="307">report integrity</text><text x="882" y="307">user-approved</text><text x="1070" y="307">CLI / SARIF / PDF</text></g></g><text x="600" y="374" fill="#9aabbc" font-family="Arial" font-size="14" text-anchor="middle">Each hand-off preserves deterministic identity and explicit incomplete states.</text></svg>
