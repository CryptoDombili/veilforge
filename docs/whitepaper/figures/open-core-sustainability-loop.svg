<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Open-core commercial sustainability loop</title><desc id="desc">A planning hypothesis where useful free local tooling informs managed workflow demand and future revenue is reinvested into public product quality.</desc><rect width="1200" height="600" rx="28" fill="#09111c"/><text x="60" y="68" fill="#75f7c8" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">OPEN-CORE SUSTAINABILITY HYPOTHESIS</text><circle cx="600" cy="315" r="105" fill="#11243a" stroke="#75f7c8" stroke-width="3"/><text x="600" y="300" fill="#dfe8f1" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle">Useful local core</text><text x="600" y="333" fill="#91a1b2" font-family="Arial" font-size="14" text-anchor="middle">free and open</text><g fill="#101e30" stroke="#36536c" stroke-width="2"><rect x="90" y="150" width="270" height="120" rx="18"/><rect x="840" y="150" width="270" height="120" rx="18"/><rect x="840" y="390" width="270" height="120" rx="18"/><rect x="90" y="390" width="270" height="120" rx="18"/></g><g fill="#dce6ef" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><text x="225" y="205">Local adoption</text><text x="975" y="205">Validated demand</text><text x="975" y="445">Managed workflows</text><text x="225" y="445">Reinvestment</text></g><g fill="#8293a7" font-family="Arial" font-size="13" text-anchor="middle"><text x="225" y="233">developer evidence</text><text x="975" y="233">not assumed customers</text><text x="975" y="473">future paid roadmap</text><text x="225" y="473">detectors + security</text></g><g stroke="#75f7c8" stroke-width="3" fill="none"><path d="M360 210C510 95 700 95 840 210"/><path d="M975 270V390"/><path d="M840 450C700 560 500 560 360 450"/><path d="M225 390V270"/></g><text x="600" y="566" fill="#9aabbc" font-family="Arial" font-size="14" text-anchor="middle">Pricing, conversion, retention and revenue remain planning hypotheses - not guarantees.</text></svg>
