name: VeilForge V4 Scan
description: Run an isolated VeilForge scan, emit verified SARIF, and enforce a deterministic policy gate.
inputs:
  project-id:
    description: Stable project identifier
    required: true
  source:
    description: Newline-separated source directories
    required: true
  domains:
    description: Comma-separated VeilForge domains
    required: false
    default: payments
  compiler-version:
    description: Exact Solidity compiler version
    required: false
    default: 0.8.24
  policy:
    description: Optional policy JSON path
    required: false
  taxonomy:
    description: Optional taxonomy path
    required: false
  output:
    description: Relative artifact directory
    required: false
    default: veilforge-output
  gate-config:
    description: Path to gate configuration JSON
    required: true
  baseline-report:
    description: Optional path to a verified previous report
    required: false
  fail-on-gate:
    description: Fail the action when the policy gate fails
    required: false
    default: 'true'
  upload-sarif:
    description: Generate SARIF for a later upload-sarif step
    required: false
    default: 'true'
  stage-timeout:
    description: Per-stage timeout in milliseconds
    required: false
    default: '120000'
  global-timeout:
    description: Hard worker timeout in milliseconds
    required: false
    default: '300000'
outputs:
  status:
    description: CLI scan status
    value: ${{ steps.veilforge.outputs.status }}
  passed:
    description: Whether the gate passed
    value: ${{ steps.veilforge.outputs.passed }}
  findings-count:
    description: Total projected findings
    value: ${{ steps.veilforge.outputs['findings-count'] }}
  active-findings-count:
    description: Findings matched by the gate
    value: ${{ steps.veilforge.outputs['active-findings-count'] }}
  incomplete-count:
    description: Analysis incomplete reason count
    value: ${{ steps.veilforge.outputs['incomplete-count'] }}
  sarif-path:
    description: Verified SARIF path
    value: ${{ steps.veilforge.outputs['sarif-path'] }}
  export-path:
    description: Verified export directory
    value: ${{ steps.veilforge.outputs['export-path'] }}
  report-hash:
    description: Canonical report integrity hash
    value: ${{ steps.veilforge.outputs['report-hash'] }}
  gate-decision:
    description: allow or deny
    value: ${{ steps.veilforge.outputs['gate-decision'] }}
runs:
  using: composite
  steps:
    - name: Install pinned VeilForge runtime
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci --omit=dev --ignore-scripts
    - name: Run VeilForge V4 scan
      id: veilforge
      shell: bash
      env:
        INPUT_PROJECT_ID: ${{ inputs.project-id }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_DOMAINS: ${{ inputs.domains }}
        INPUT_COMPILER_VERSION: ${{ inputs.compiler-version }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_TAXONOMY: ${{ inputs.taxonomy }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_GATE_CONFIG: ${{ inputs.gate-config }}
        INPUT_BASELINE_REPORT: ${{ inputs.baseline-report }}
        INPUT_FAIL_ON_GATE: ${{ inputs.fail-on-gate }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_STAGE_TIMEOUT: ${{ inputs.stage-timeout }}
        INPUT_GLOBAL_TIMEOUT: ${{ inputs.global-timeout }}
      run: node "$GITHUB_ACTION_PATH/entrypoint.mjs"
