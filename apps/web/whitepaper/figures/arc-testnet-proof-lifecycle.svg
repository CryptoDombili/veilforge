<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Arc Testnet proof publication lifecycle</title><desc id="desc">Verified report hash passes trusted preflight and explicit user approval before Arc Testnet publication, receipt and event reconciliation, persistence and duplicate prevention.</desc><rect width="1200" height="560" rx="28" fill="#09111c"/><text x="60" y="68" fill="#75f7c8" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">ARC TESTNET PROOF LIFECYCLE</text><g fill="#101e30" stroke="#36536c" stroke-width="2"><rect x="60" y="130" width="235" height="110" rx="16"/><rect x="365" y="130" width="235" height="110" rx="16"/><rect x="670" y="130" width="235" height="110" rx="16"/><rect x="975" y="130" width="165" height="110" rx="16"/><rect x="180" y="330" width="265" height="110" rx="16"/><rect x="510" y="330" width="265" height="110" rx="16"/><rect x="840" y="330" width="265" height="110" rx="16"/></g><g fill="#dce6ef" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><text x="177" y="180">Verified report hash</text><text x="482" y="180">Trusted preflight</text><text x="787" y="180">Explicit approval</text><text x="1057" y="180">Publish</text><text x="312" y="380">Receipt + event</text><text x="642" y="380">Verified persistence</text><text x="972" y="380">Duplicate prevention</text></g><g fill="#8192a6" font-family="Arial" font-size="13" text-anchor="middle"><text x="177" y="209">canonical identity</text><text x="482" y="209">chain / registry / gas</text><text x="787" y="209">wallet remains user-gated</text><text x="1057" y="209">Testnet only</text><text x="312" y="409">publisher + hash match</text><text x="642" y="409">provider-verified state</text><text x="972" y="409">second send blocked</text></g><g stroke="#75f7c8" stroke-width="3" fill="none"><path d="M295 185H365"/><path d="M600 185H670"/><path d="M905 185H975"/><path d="M1057 240V285H312V330"/><path d="M445 385H510"/><path d="M775 385H840"/></g><text x="60" y="510" fill="#9aabbc" font-family="Arial" font-size="14">Observed Arc Testnet evidence is bounded to the verified transaction identity; it does not claim mainnet deployment.</text></svg>
