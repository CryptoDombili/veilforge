<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">VeilForge V4 architecture</title><desc id="desc">Local Solidity source flows through compiler-backed analysis, verified findings, a deterministic report and policy gate, then optionally to Arc proof publication.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1726"/><stop offset="1" stop-color="#070b12"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#75f7c8"/></marker></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="64" y="78" fill="#75f7c8" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">VEILFORGE V4 ARCHITECTURE</text><text x="64" y="112" fill="#8d9aae" font-family="Arial" font-size="16">Local source stays inside the selected runtime boundary</text>
  <g fill="#101d2e" stroke="#31506a" stroke-width="2"><rect x="64" y="220" width="180" height="138" rx="18"/><rect x="294" y="180" width="210" height="218" rx="18"/><rect x="554" y="180" width="210" height="218" rx="18"/><rect x="814" y="180" width="160" height="218" rx="18"/><rect x="1024" y="220" width="120" height="138" rx="18"/></g>
  <g fill="#dce5ef" font-family="Arial" font-weight="700" text-anchor="middle"><text x="154" y="273" font-size="20">Solidity</text><text x="154" y="301" font-size="20">project</text><text x="399" y="238" font-size="20">Compiler-backed</text><text x="399" y="266" font-size="20">analysis</text><text x="659" y="238" font-size="20">Verified</text><text x="659" y="266" font-size="20">findings</text><text x="894" y="238" font-size="20">Report +</text><text x="894" y="266" font-size="20">policy gate</text><text x="1084" y="273" font-size="20">Arc</text><text x="1084" y="301" font-size="20">proof</text></g>
  <g fill="#8fa0b3" font-family="Arial" font-size="14" text-anchor="middle"><text x="154" y="330">local input</text><text x="399" y="306">AST / IR / CFG</text><text x="399" y="331">call graph / dataflow</text><text x="399" y="356">domain detectors</text><text x="659" y="306">evidence traces</text><text x="659" y="331">incomplete states</text><text x="659" y="356">deterministic grouping</text><text x="894" y="306">schema 4.1.0</text><text x="894" y="331">hash v2</text><text x="894" y="356">passed / allow</text><text x="1084" y="330">optional</text></g>
  <g stroke="#75f7c8" stroke-width="3" fill="none" marker-end="url(#arrow)" filter="url(#glow)"><path d="M244 289H284"/><path d="M504 289H544"/><path d="M764 289H804"/><path d="M974 289H1014"/></g>
  <rect x="300" y="460" width="600" height="76" rx="16" fill="#0b241f" stroke="#397965"/><text x="600" y="492" fill="#bdfbe6" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle">No remote source upload required</text><text x="600" y="519" fill="#8da89f" font-family="Arial" font-size="14" text-anchor="middle">Share evidence and report identity - not private Solidity source</text>
</svg>
