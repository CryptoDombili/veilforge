<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Mainnet staged rollout and rollback</title><desc id="desc">Fail-closed stages from unresolved configuration through review, rehearsal, read-only verification and limited publication, with stop gates and rollback to disabled publishing.</desc><rect width="1200" height="540" rx="28" fill="#09111c"/><text x="60" y="68" fill="#75f7c8" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">MAINNET STAGED ROLLOUT / ROLLBACK</text><g font-family="Arial"><g fill="#101e30" stroke="#36536c" stroke-width="2"><rect x="60" y="140" width="185" height="115" rx="16"/><rect x="285" y="140" width="185" height="115" rx="16"/><rect x="510" y="140" width="185" height="115" rx="16"/><rect x="735" y="140" width="185" height="115" rx="16"/><rect x="960" y="140" width="180" height="115" rx="16"/></g><g fill="#dce6ef" font-size="17" font-weight="700" text-anchor="middle"><text x="152" y="190">Resolve config</text><text x="377" y="190">Independent review</text><text x="602" y="190">Rehearse</text><text x="827" y="190">Read only</text><text x="1050" y="190">Limited publish</text></g><g fill="#8293a7" font-size="13" text-anchor="middle"><text x="152" y="220">currently unresolved</text><text x="377" y="220">required gate</text><text x="602" y="220">deterministic</text><text x="827" y="220">observe first</text><text x="1050" y="220">monitored cohort</text></g></g><g stroke="#75f7c8" stroke-width="3"><path d="M245 197H285M470 197H510M695 197H735M920 197H960"/></g><rect x="285" y="350" width="630" height="105" rx="18" fill="#26131a" stroke="#ff6b88" stroke-width="2"/><text x="600" y="393" fill="#ff9caf" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle">STOP / ROLLBACK GATE</text><text x="600" y="425" fill="#bd91a0" font-family="Arial" font-size="14" text-anchor="middle">Disable proof reads and publishing; preserve evidence and incident record.</text><g stroke="#ff6b88" stroke-width="2" stroke-dasharray="7 7"><path d="M377 255V350M602 255V350M827 255V350M1050 255V315H915"/></g><text x="60" y="500" fill="#9aabbc" font-family="Arial" font-size="14">Current boundary: enabled=false / proofReadEnabled=false / publishEnabled=false.</text></svg>
