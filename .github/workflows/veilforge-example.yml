name: VeilForge example
on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - id: veilforge
        uses: ./action
        with:
          project-id: ${{ github.repository }}
          source: contracts
          domains: payments,treasury,private-credit
          output: veilforge-output
          gate-config: examples/github-actions/veilforge-gate.json
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.veilforge.outputs.sarif-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veilforge-v4-results
          path: ${{ steps.veilforge.outputs.export-path }}
