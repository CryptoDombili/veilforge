name: V4 web cross-browser acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v4.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-web-cross-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.60.0

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:grant-release
      - run: npm run test:web-v4-acceptance
      - run: npm run test:web-v4-security
      - run: npm run test:web-v4-rollback
      - run: node --test tests/web/v4-acceptance/lifecycle-diagnostic.test.mjs
      - run: node --test tests/web/v4-acceptance/repeated-worker-stress.test.mjs

  browser:
    needs: targeted
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build:grant-release
      - name: Real production-artifact browser acceptance
        run: node scripts/smoke-web-v4-cross-browser.mjs --browser=${{ matrix.browser }} --summary=output/ci-safe/${{ matrix.browser }}.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v4-web-${{ matrix.browser }}-safe-summary
          path: output/ci-safe/${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 7

  edge:
    needs: targeted
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@${{ env.PLAYWRIGHT_VERSION }}
      - run: npm run build:grant-release
      - name: Real production-artifact Edge acceptance
        run: node scripts/smoke-web-v4-cross-browser.mjs --browser=edge --summary=output/ci-safe/edge.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v4-web-edge-safe-summary
          path: output/ci-safe/edge.json
          if-no-files-found: error
          retention-days: 7

  regression:
    needs: [targeted, browser, edge]
    if: always() && needs.targeted.result == 'success' && needs.browser.result == 'success' && (needs.edge.result == 'success' || needs.edge.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:grant-release
      - run: npm run verify:grant-release-artifact
      - run: npm run smoke:grant-release-app
      - run: npm run smoke:web-v4-rollback
      - run: npm run build && npm run smoke:browser
      - run: npm run test:web-v4-ui && npm run test:web-v4-ui-accessibility && npm run test:web-v4-ui-history && npm run test:web-v4-ui-export
      - run: npm run smoke:web-v4-ui && npm run smoke:web-v4-ui-responsive
      - run: npm run build:web-v4-runtime && npm run verify:web-v4-runtime && npm run smoke:web-v4-real-scan
      - run: npm run benchmark:v4
      - run: npm run smoke:v4-release-gate
      - run: npm run test:v4-sdk && npm run test:v4-report && npm run test:v4-export && npm run test:v4-orchestration
      - run: npm run typecheck
      - run: npm run manifest:check
